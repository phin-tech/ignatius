[project]
name = "ignatius"
version = "0.1.0"
description = "Orchestrate System One decision models: single, fan-out and cascade."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sam Phinizy" }]
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ignatius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
